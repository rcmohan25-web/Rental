# Weekly pg_dump of the dev/demo database (the free tier has no backups).
# Secret: SUPABASE_DB_URL = the Session pooler connection string (IPv4 friendly).
# The dump is stored as a private workflow artifact for 30 days.
# TODO(Mohan): test a restore once (see docs/setup/github-setup-mohan.md).
name: Backup database

on:
  schedule:
    - cron: "0 20 * * 6"   # Saturday 20:00 UTC (Sunday morning in Nepal)
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - name: Dump
        if: env.DB_URL != ''
        run: |
          docker run --rm postgres:17 pg_dump "$DB_URL" \
            --no-owner --no-privileges --schema=public > rental-backup.sql
          gzip rental-backup.sql
      - uses: actions/upload-artifact@v4
        if: env.DB_URL != ''
        with:
          name: rental-db-backup-${{ github.run_id }}
          path: rental-backup.sql.gz
          retention-days: 30
      - name: Not configured
        if: env.DB_URL == ''
        run: echo "SUPABASE_DB_URL secret not set, skipping backup."
