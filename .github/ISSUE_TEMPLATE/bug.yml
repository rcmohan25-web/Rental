name: Bug
description: Something is broken
labels: ["bug"]
body:
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual result
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and build
      placeholder: "Pixel 6, Android 14, main @ abc1234"
